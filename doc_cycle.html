<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Цикл документации</title>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background: #F8FAFC;
        }
        
        .header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header__title {
            font-size: 18px;
            font-weight: 600;
            color: #1E293B;
        }
        
        .header__badge {
            background: #3B82F6;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin: 0 2px;
        }
        
        .legend {
            position: fixed;
            top: 80px;
            left: 16px;
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            z-index: 1000;
            max-width: 180px;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            margin-right: 8px;
        }
        
        #cy {
            width: 100%;
            height: calc(100vh - 160px);
            border: 1px solid #E2E8F0;
            background: white;
            margin: 20px 0;
        }
        
        .sidebar {
            position: fixed;
            top: 80px;
            right: 16px;
            width: 300px;
            max-height: calc(100vh - 160px);
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 16px;
            font-size: 11px;
            z-index: 1000;
            overflow-y: auto;
            display: none;
        }
        
        .sidebar-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #374151;
            font-size: 14px;
        }
        
        .sidebar-description {
            line-height: 1.5;
            color: #6B7280;
            margin-bottom: 12px;
        }
        
        .stats {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 11px;
            color: #6B7280;
            z-index: 1000;
        }
        
        .controls {
            position: fixed;
            bottom: 60px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 1000;
        }
        
        .control-btn {
            width: 32px;
            height: 32px;
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #374151;
        }
        
        .control-btn:hover {
            background: #F1F5F9;
        }
        
        .search {
            position: fixed;
            top: 80px;
            left: 220px;
            z-index: 1000;
        }
        
        .search-input {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }
        
        .search-input:focus {
            border-color: #3B82F6;
        }
    </style>
</head>
<body>
    <header class="header">

        <div class="header__badges">

            <span class="header__badge">Нейронка</span>
            <span class="header__badge">Автоматизация</span>

        </div>
        <div class="legend-item">

        <div class="legend-item">

            <span>Автоматика</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #64748B;"></div>
            <span>Данные</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #DC2626;"></div>
            <span>События</span>
        </div>
    </div>
    
    <div class="search">
        <input type="text" class="search-input" placeholder="Поиск узлов..." id="searchInput">
    </div>

    <div id="cy"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title" id="sidebarTitle">Детали узла</div>

    </div>
    
    <div class="controls">
        <button class="control-btn" onclick="zoomIn()">+</button>
        <button class="control-btn" onclick="fitToScreen()">⊡</button>
        <button class="control-btn" onclick="zoomOut()">−</button>
    </div>

    <div class="stats">
        <span>Элементы: </span><span id="elements">0</span>
        <span> • Связи: </span><span id="edges">0</span>

                cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: [...originalNodes, ...originalEdges],
                    style: [

                                'cursor': 'pointer'
                            }
                        },
                        {
                            selector: 'node[pool="techwriter"]',
                            style: {

                        },
                        {

                            }
                        },

                            }
                        },
                        {
                            selector: 'node[type="start"], node[type="end"]',
                            style: {
                                'background-color': '#DC2626',
                                'width': 50,
                                'height': 50,
                                'shape': 'ellipse'
                            }
                        },
                        {

                                'height': 50,
                                'shape': 'diamond'
                            }
                        },

                            }
                        },

                // Обработчик кликов на узлы
                cy.on('tap', 'node', function(evt) {
                    const node = evt.target;
                    showNodeDetails(node);
                });
                
                // Инициализируем поиск
                initSearch();
                
                // Первоначальная подгонка размера
                setTimeout(() => {
                    cy.fit(undefined, 30);
                }, 200);

                console.error('Ошибка инициализации:', error);
                document.body.innerHTML = '<h1>ОШИБКА: ' + error.message + '</h1>';

        function showNodeDetails(node) {
            const nodeData = node.data();
            const nodeId = nodeData.id;
            const sidebar = document.getElementById('sidebar');
            const title = document.getElementById('sidebarTitle');
            const description = document.getElementById('sidebarDescription');
            
            // Получаем детальное описание из справочника
            const details = nodeDetails[nodeId];
            const fullDescription = details ? details.description : nodeData.description;
            const specs = details ? details.specs : null;
            
            title.textContent = nodeData.label;
            
            // Формируем описание
            let html = '<p style="line-height: 1.5; margin-bottom: 14px;">' + fullDescription + '</p>';
            
            // Добавляем specs если есть
            if (specs) {
                html += '<div class="tech-specs" style="margin-top: 14px; border-top: 1px solid #E5E7EB; padding-top: 12px;">';
                for (const [key, value] of Object.entries(specs)) {
                    html += '<div class="spec-item" style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #F1F5F9; font-size: 10px;">';
                    html += '<span style="color: #6B7280; font-weight: 500;">' + key + ':</span>';
                    html += '<span style="color: #1E293B; text-align: right; max-width: 65%; word-break: break-word;">' + value + '</span>';
                    html += '</div>';
                }
                html += '</div>';
            }
            
            description.innerHTML = html;
            sidebar.style.display = 'block';
            
            // Выделяем выбранный узел
            cy.nodes().removeClass('highlighted');
            node.addClass('highlighted');
        }
        
        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            
            // Создаем индекс поиска
            searchIndex = cy.nodes().map(node => ({
                node: node,
                id: node.id(),
                label: node.data('label').toLowerCase()
            }));
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                
                if (query === '') {
                    cy.nodes().removeClass('search-highlight dimmed');
                    return;
                }
                
                cy.nodes().addClass('dimmed').removeClass('search-highlight');
                
                const matches = searchIndex.filter(item => 
                    item.label.includes(query) || item.id.toLowerCase().includes(query)
                );
                
                matches.forEach(match => {
                    match.node.removeClass('dimmed').addClass('search-highlight');
                });
            });
        }
        
        function zoomIn() {
            if (cy) cy.zoom(cy.zoom() * 1.2);
        }
        
        function zoomOut() {
            if (cy) cy.zoom(cy.zoom() * 0.8);
        }
        
        function fitToScreen() {
            if (cy) cy.fit(undefined, 30);
        }
        
        // Закрытие сайдбара при клике в пустое место
        document.addEventListener('click', function(e) {
            const sidebar = document.getElementById('sidebar');
            const cyElement = document.getElementById('cy');
            
            if (e.target === cyElement) {
                sidebar.style.display = 'none';
                if (cy) cy.nodes().removeClass('highlighted');
            }
        });
