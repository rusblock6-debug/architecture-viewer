<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НАВИГАТОР.ПГР - Документация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg-color: #fafbfc;
            --sidebar-bg: #2c3e50;
            --sidebar-hover: #34495e;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
            --text-light: #95a5a6;
            --border-color: #e1e8ed;
            --accent-color: #ed8d48;
            --accent-hover-color: #d67a38;
            --accent-light: #fef5ef;
            --code-bg: #f7f9fa;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-hover: 0 12px 32px rgba(237, 141, 72, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        * {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.5s ease;
        }
        
        *.scrolling {
            scrollbar-color: var(--accent-color) transparent;
        }
        
        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        *::-webkit-scrollbar-track {
            background: transparent;
        }
        
        *::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 10px;
            transition: background-color 0.5s ease;
        }
        
        *.scrolling::-webkit-scrollbar-thumb {
            background-color: var(--accent-color);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 15px;
        }

        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: linear-gradient(135deg, #ffffff 0%, #fafbfc 100%);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .main-header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .main-header-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .readonly-badge {
            background: linear-gradient(135deg, #ed8d48, #d67a38);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .menu-toggle {
            display: none;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover-color) 100%);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            padding-top: 64px;
        }
        .main-wrapper {
            display: flex;
            flex: 1;
        }
        .content-wrapper {
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        .sidebar {
            width: 320px;
            background: linear-gradient(180deg, var(--sidebar-bg) 0%, #243342 100%);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
        }
        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }

        .sidebar-toggle {
            position: absolute;
            left: 320px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: none;
            padding: 12px 6px;
            cursor: pointer;
            z-index: 100;
            border-radius: 0 8px 8px 0;
        }
        .sidebar.collapsed + .sidebar-toggle {
            left: 0;
        }
        .sidebar-toggle::after {
            content: '◀';
        }
        .sidebar.collapsed + .sidebar-toggle::after {
            content: '▶';
        }

        .sidebar-header {
            padding: 28px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.1);
        }
        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }
        .search-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .toc-nav {
            flex-grow: 1;
            padding: 20px 0;
        }
        .toc ul {
            list-style: none;
            padding: 0;
        }
        .toc-group-title {
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            font-size: 11px;
            padding: 16px 24px 8px 20px;
        }
        .toc-level-1 li a {
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            display: block;
            padding: 12px 48px 12px 20px;
            font-size: 14px;
            border-left: 3px solid transparent;
        }
        .toc-level-1 li a:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
            border-left-color: var(--accent-color);
        }
        .toc-level-1 li a.active {
            color: #ffffff;
            background-color: rgba(237, 141, 72, 0.15);
            border-left-color: var(--accent-color);
        }

        .content-pane {
            flex: 1;
            padding: 48px 72px 32px 72px;
            max-width: 1400px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }
        .footer-note {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
        }

        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }

        .section-group-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-6px);
        }

        .card-head {
            padding: 28px 32px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, #fafbfc 0%, #ffffff 100%);
        }
        .card-path {
            font-size: 22px;
            font-weight: 700;
        }
        .card-description {
            padding: 28px 32px;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .card-screenshot {
            padding: 32px;
            background: linear-gradient(135deg, #f7f9fa 0%, #fafbfc 100%);
        }
        .preview-image {
            max-width: 100%;
            max-height: 450px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
        }

        .step-image {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
        }

        .directory-table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .directory-table {
            width: 100%;
            border-collapse: collapse;
        }
        .directory-table th {
            background: linear-gradient(135deg, #f7f9fa 0%, #fafbfc 100%);
            padding: 14px 24px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            border-bottom: 2px solid var(--border-color);
        }
        .directory-table td {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .directory-table tr:hover {
            background-color: var(--accent-light);
        }

        .modal-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(44, 62, 80, 0.92); 
            backdrop-filter: blur(8px);
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999; 
        }
        .modal-overlay.active { display: flex; }
        .modal-content img { 
            max-width: 85vw; 
            max-height: 85vh; 
            border-radius: 8px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }
        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .modal-prev { left: 32px; }
        .modal-next { right: 32px; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; position: fixed; top: 15px; left: 15px; z-index: 1002; }
            .sidebar-toggle { display: none; }
            .sidebar { position: fixed; z-index: 1001; transform: translateX(-100%); width: 300px; }
            .sidebar.open { transform: translateX(0); }
            .content-pane { padding: 32px 20px 20px 20px; }
            .main-header-title { font-size: 18px; }
        }

        .notification { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover-color) 100%);
            color: white; 
            padding: 15px 25px; 
            border-radius: 12px; 
            z-index: 2000; 
            animation: slideIn 0.3s ease;
            font-weight: 600;
        }
        @keyframes slideIn { 
            from { transform: translateX(120%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="main-header-left">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="main-header-title">НАВИГАТОР.ПГР</div>
            <div class="main-header-subtitle">Инструкция пользователя</div>
            <div class="readonly-badge" id="readonlyBadge" style="display:none;">📖 Только чтение</div>
        </div>
    </header>

    <div class="app-container">
        <div class="main-wrapper">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">Содержание</div>
                </div>
                <div class="search-container">
                    <input type="text" id="globalSearch" class="search-input" placeholder="🔍 Поиск..." oninput="performGlobalSearch(this.value)">
                </div>
                <nav class="toc-nav" id="toc"></nav>
            </aside>
            <button class="sidebar-toggle" onclick="toggleSidebarDesktop()"></button>

            <div class="content-wrapper">
                <main class="content-pane">
                    <div id="section-quickstart" class="content-section active">
                        <h2 class="section-group-title">Быстрый старт</h2>
                        <div id="quickstartContent"><div class="loading">Загрузка...</div></div>
                    </div>
                    <div id="section-descriptive" class="content-section">
                        <h2 class="section-group-title">Обзор</h2>
                        <div id="descriptiveCards"><div class="loading">Загрузка...</div></div>
                    </div>
                    <div id="section-instruction" class="content-section">
                        <h2 class="section-group-title">Пошаговые инструкции</h2>
                        <div id="instructionCards"><div class="loading">Загрузка...</div></div>
                    </div>
                    <div id="section-about" class="content-section">
                        <h2 class="section-group-title">О системе</h2>
                        <div id="aboutCards"><div class="loading">Загрузка...</div></div>
                    </div>
                    <div id="section-directories" class="content-section">
                        <h2 class="section-group-title">Справочники</h2>
                        <div id="directoriesCards"><div class="loading">Загрузка...</div></div>
                    </div>
                    <div id="section-admin" class="content-section">
                        <h2 class="section-group-title">Администрирование</h2>
                        <div id="adminCards"><div class="loading">Загрузка...</div></div>
                    </div>
                </main>
                <div class="footer-note">
                    <div>ООО «НИР - Центр», г.Екатеринбург</div>
                    <div>Последнее обновление: <span id="lastUpdateDate">20.03.2026</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="imageModal" onclick="closeImageModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button id="modalPrevBtn" class="modal-nav-btn modal-prev" onclick="navigateImage(-1)" style="display:none;">◀</button>
            <button id="modalNextBtn" class="modal-nav-btn modal-next" onclick="navigateImage(1)" style="display:none;">▶</button>
            <img id="modalImage" src="" alt="">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        // === ОПРЕДЕЛЕНИЕ РЕЖИМА GITHUB PAGES ===
        const isGitHubPages = window.location.hostname.includes('github.io');
        
        let appData = null;
        let currentImageIndex = 0;
        let allImages = [];
        let isSearching = false;
        let searchTimeout = null;

        function showNotification(msg) {
            const n = document.createElement('div');
            n.className = 'notification';
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        function toggleSidebarDesktop() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function generateDetailedToc() {
            const toc = document.getElementById('toc');
            if (!appData) return;
            
            let html = '<div class="toc-level-1"><li style="list-style:none;"><a href="#" onclick="showSection(\'quickstart\'); return false;">Быстрый старт</a></li></div>';
            
            if (appData.cards.descriptive && appData.cards.descriptive.length) {
                html += '<div class="toc-group-title">Обзор</div><ul>';
                appData.cards.descriptive.forEach(c => {
                    html += `<li><a href="#" onclick="showCard('descriptive', '${c.id}'); return false;">${c.title}</a></li>`;
                });
                html += '</ul>';
            }
            
            if (appData.cards.instructions && appData.cards.instructions.length) {
                html += '<div class="toc-group-title">Пошаговые инструкции</div><ul>';
                appData.cards.instructions.forEach(c => {
                    html += `<li><a href="#" onclick="showCard('instruction', '${c.id}'); return false;">${c.navTitle || c.title}</a></li>`;
                });
                html += '</ul>';
            }
            
            if (appData.cards.admin_instructions && appData.cards.admin_instructions.length) {
                html += '<div class="toc-group-title">Администрирование</div><ul>';
                appData.cards.admin_instructions.forEach(c => {
                    html += `<li><a href="#" onclick="showCard('admin', '${c.id}'); return false;">${c.navTitle || c.title}</a></li>`;
                });
                html += '</ul>';
            }
            
            if (appData.cards.about && appData.cards.about.length) {
                html += '<div class="toc-group-title">О системе</div><ul>';
                appData.cards.about.forEach(c => {
                    html += `<li><a href="#" onclick="showCard('about', '${c.id}'); return false;">${c.title}</a></li>`;
                });
                html += '</ul>';
            }
            
            html += '<div class="toc-group-title">Справочники</div><ul id="directories-toc-list"><li>Загрузка...</li></ul>';
            toc.innerHTML = html;
            loadDirectoriesToc();
        }

        async function loadDirectoriesToc() {
            try {
                const resp = await fetch('directory_data.json');
                const data = await resp.json();
                const list = document.getElementById('directories-toc-list');
                if (list) {
                    let html = '';
                    for (const [key, dir] of Object.entries(data.directories)) {
                        html += `<li><a href="#" onclick="showDirectory('${key}'); return false;">${dir.title}</a></li>`;
                    }
                    list.innerHTML = html || '<li>Нет справочников</li>';
                }
            } catch(e) {
                console.error('Ошибка загрузки справочников в TOC:', e);
            }
        }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`section-${sectionId}`).classList.add('active');
            document.querySelector('.content-pane').scrollTo({ top: 0, behavior: 'auto' });
        }

        function showCard(sectionType, cardId) {
            let targetSection = 'descriptive';
            if (sectionType === 'instruction') targetSection = 'instruction';
            else if (sectionType === 'admin') targetSection = 'admin';
            else if (sectionType === 'about') targetSection = 'about';
            else targetSection = 'descriptive';
            
            showSection(targetSection);
            setTimeout(() => {
                const el = document.getElementById(`card-${cardId}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'auto', block: 'start' });
                    el.style.boxShadow = '0 0 0 3px var(--accent-color)';
                    setTimeout(() => el.style.boxShadow = '', 1500);
                }
            }, 100);
        }

        function showDirectory(key) {
            showSection('directories');
            const container = document.getElementById('directoriesCards');
            container.innerHTML = '<div class="loading">Загрузка...</div>';
            
            fetch('directory_data.json')
                .then(r => r.json())
                .then(data => {
                    const dir = data.directories[key];
                    if (!dir) {
                        container.innerHTML = '<p>Справочник не найден</p>';
                        return;
                    }
                    let html = `<h2 style="margin-bottom:30px;">${dir.title}</h2>
                        <table class="directory-table">
                            <thead><tr><th>Параметр</th><th>На что влияет</th></tr></thead>
                            <tbody>`;
                    dir.parameters.forEach(p => {
                        html += `<tr>
                            <td><strong>${p.name}</strong><br><small>${p.unit || ''}</small><br>${p.description || ''}</td>
                            <td><ul style="margin:0;padding-left:20px;">${p.impact.map(i => `<li>${i}</li>`).join('')}</ul></td>
                        </tr>`;
                    });
                    html += `</tbody></table>`;
                    if (dir.image) html += `<div style="margin-top:30px;text-align:center;"><img src="${dir.image}" style="max-width:100%;border-radius:8px;"></div>`;
                    container.innerHTML = html;
                })
                .catch(e => container.innerHTML = '<p>Ошибка загрузки</p>');
        }

        function renderQuickstart() {
            const qs = appData?.cards?.quickstart;
            if (!qs || !qs.steps) {
                document.getElementById('quickstartContent').innerHTML = '<p>Нет данных</p>';
                return;
            }
            let html = '';
            qs.steps.forEach((step, si) => {
                html += `<div class="card"><div class="card-head"><div class="card-path">${step.title}</div></div>`;
                (step.substeps || []).forEach(sub => {
                    html += `<div class="card-description"><p><strong>${sub.text}</strong></p>`;
                    if (sub.details) {
                        sub.details.forEach(d => {
                            if (d.trim()) html += `<div style="margin-bottom:8px;">${d}</div>`;
                        });
                    }
                    html += `</div>`;
                    if (sub.images && sub.images.length) {
                        html += `<div class="card-screenshot">`;
                        sub.images.forEach(img => {
                            html += `<img src="${img}" class="preview-image" onclick="openImageModal('${img}')" style="margin:5px;max-width:200px;">`;
                        });
                        html += `</div>`;
                    }
                });
                html += `</div>`;
            });
            document.getElementById('quickstartContent').innerHTML = html;
        }

        function renderDescriptive() {
            const cards = appData?.cards?.descriptive || [];
            const container = document.getElementById('descriptiveCards');
            if (!cards.length) { container.innerHTML = '<p>Нет карточек</p>'; return; }
            container.innerHTML = cards.map(c => `
                <div class="card" id="card-${c.id}">
                    <div class="card-head"><div class="card-path">${c.title || ''}</div></div>
                    <div class="card-description">
                        ${c.description || ''}
                        ${c.items ? c.items.map(i => `<div style="margin-bottom:8px;">▸ ${i}</div>`).join('') : ''}
                    </div>
                    ${c.image ? `<div class="card-screenshot"><img src="${c.image}" class="preview-image" onclick="openImageModal('${c.image}')"></div>` : ''}
                </div>
            `).join('');
        }

        function renderInstructions() {
            const cards = appData?.cards?.instructions || [];
            const container = document.getElementById('instructionCards');
            if (!cards.length) { container.innerHTML = '<p>Нет инструкций</p>'; return; }
            container.innerHTML = cards.map(c => `
                <div class="card" id="card-${c.id}">
                    <div class="card-head"><div class="card-path">${c.title || ''}</div></div>
                    <div class="card-description">${c.description || ''}</div>
                    ${c.steps ? c.steps.map((s, i) => `
                        <div style="padding:20px;border-bottom:1px solid var(--border-color);">
                            <div style="font-weight:700;color:var(--accent-color);margin-bottom:10px;">Шаг ${i+1}</div>
                            <div>${s.text}</div>
                            ${s.details ? s.details.map(d => `<div style="margin-left:20px;margin-top:5px;">${d}</div>`).join('') : ''}
                            ${s.images ? s.images.map(img => `<img src="${img}" class="step-image" onclick="openImageModal('${img}')">`).join('') : ''}
                        </div>
                    `).join('') : ''}
                </div>
            `).join('');
        }

        function renderAdminInstructions() {
            const cards = appData?.cards?.admin_instructions || [];
            const container = document.getElementById('adminCards');
            if (!cards.length) { container.innerHTML = '<p>Нет инструкций</p>'; return; }
            container.innerHTML = cards.map(c => `
                <div class="card" id="card-${c.id}">
                    <div class="card-head"><div class="card-path">${c.title || ''}</div></div>
                    <div class="card-description">${c.description || ''}</div>
                    ${c.steps ? c.steps.map((s, i) => `
                        <div style="padding:20px;border-bottom:1px solid var(--border-color);">
                            <div style="font-weight:700;color:var(--accent-color);margin-bottom:10px;">${s.text}</div>
                            ${s.details ? s.details.map(d => `<div style="margin-left:20px;margin-top:5px;">${d}</div>`).join('') : ''}
                            ${s.images ? s.images.map(img => `<img src="${img}" class="step-image" onclick="openImageModal('${img}')">`).join('') : ''}
                        </div>
                    `).join('') : ''}
                </div>
            `).join('');
        }

        function renderAbout() {
            const cards = appData?.cards?.about || [];
            const container = document.getElementById('aboutCards');
            if (!cards.length) { container.innerHTML = '<p>Нет данных</p>'; return; }
            container.innerHTML = cards.map(c => `
                <div class="card" id="card-${c.id}">
                    <div class="card-head"><div class="card-path">${c.title || ''}</div></div>
                    <div class="card-description">${c.content || ''}</div>
                </div>
            `).join('');
        }

        function renderAll() {
            renderQuickstart();
            renderDescriptive();
            renderInstructions();
            renderAdminInstructions();
            renderAbout();
        }

        async function loadData() {
            try {
                const resp = await fetch('data.json?t=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                appData = await resp.json();
                renderAll();
                generateDetailedToc();
            } catch(e) {
                console.error(e);
                document.querySelectorAll('#quickstartContent, #descriptiveCards, #instructionCards, #adminCards, #aboutCards').forEach(el => {
                    el.innerHTML = '<p style="color:red;">Ошибка загрузки данных. Убедитесь, что файл data.json существует.</p>';
                });
            }
        }

        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImage');
            img.src = src;
            
            const activeSection = document.querySelector('.content-section.active');
            const allImgs = activeSection ? activeSection.querySelectorAll('.preview-image, .step-image') : [];
            allImages = Array.from(allImgs).map(i => i.src);
            currentImageIndex = allImages.indexOf(src);
            
            document.getElementById('modalPrevBtn').style.display = allImages.length > 1 ? 'flex' : 'none';
            document.getElementById('modalNextBtn').style.display = allImages.length > 1 ? 'flex' : 'none';
            modal.classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function navigateImage(dir) {
            if (allImages.length === 0) return;
            currentImageIndex = (currentImageIndex + dir + allImages.length) % allImages.length;
            document.getElementById('modalImage').src = allImages[currentImageIndex];
        }

        async function performGlobalSearch(query) {
            clearTimeout(searchTimeout);
            if (!query.trim()) {
                document.querySelectorAll('.card').forEach(c => c.style.display = '');
                document.querySelectorAll('.directory-table-container').forEach(d => d.style.display = '');
                return;
            }
            
            searchTimeout = setTimeout(() => {
                const q = query.toLowerCase();
                let found = 0;
                document.querySelectorAll('.card').forEach(card => {
                    const match = card.textContent.toLowerCase().includes(q);
                    card.style.display = match ? '' : 'none';
                    if (match) found++;
                });
                
                document.querySelectorAll('.directory-table-container').forEach(dir => {
                    let hasMatch = false;
                    dir.querySelectorAll('.directory-table tbody tr').forEach(row => {
                        const match = row.textContent.toLowerCase().includes(q);
                        row.style.display = match ? '' : 'none';
                        if (match) hasMatch = true;
                    });
                    dir.style.display = hasMatch ? '' : 'none';
                    if (hasMatch) found++;
                });
                
                if (found === 0) {
                    showNotification(`По запросу "${query}" ничего не найдено`);
                }
            }, 300);
        }

        // === ДЛЯ GITHUB PAGES: скрываем кнопку добавления ===
        if (isGitHubPages) {
            document.getElementById('readonlyBadge').style.display = 'inline-block';
            // Удаляем кнопку добавления если она есть
            const addBtn = document.querySelector('.add-trigger');
            if (addBtn) addBtn.remove();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeImageModal();
            if (e.key === 'ArrowLeft' && document.getElementById('imageModal').classList.contains('active')) navigateImage(-1);
            if (e.key === 'ArrowRight' && document.getElementById('imageModal').classList.contains('active')) navigateImage(1);
        });

        loadData();
    </script>
</body>
</html>
